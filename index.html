<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>manolyam</title>
  
  <!-- Fotoğraftan Üretilen Çoklu Çözünürlüklü Favicon / Logo -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <!-- Google Fonts: Romantik & Zarif Tipografi -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #040206;
      overflow: hidden;
      cursor: pointer;
      font-family: 'Playfair Display', serif;
      user-select: none;
    }

    /* Arka plan 3D Canvas */
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Manolya Yaprağı & Efekt Katmanı */
    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Romantik Vignette & Parıltı */
    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(255, 90, 140, 0.12) 0%, rgba(120, 20, 60, 0.05) 45%, rgba(4, 2, 6, 0.65) 85%);
      transform: translateZ(0);
      will-change: transform;
    }

    /* ===================================================
       SAĞ ÜST: SANA BİR MEKTUP VAR BUTONU (MOBİLDE KUSURSUZ)
       =================================================== */
    .letter-btn {
      position: absolute;
      top: 22px;
      right: 22px;
      z-index: 20;
    }

    .glass-btn {
      background: rgba(35, 15, 28, 0.60);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 160, 200, 0.35);
      border-radius: 30px;
      padding: 9px 20px;
      color: #ffe5ef;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 15px rgba(255, 105, 180, 0.20);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .glass-btn:hover {
      background: rgba(85, 25, 60, 0.80);
      border-color: rgba(255, 180, 220, 0.65);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 105, 180, 0.40);
      color: #fff;
    }

    /* Modal Arka Planı */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 3, 10, 0.80);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    /* Aşk Mektubu Penceresi */
    .love-letter-card {
      width: 100%;
      max-width: 460px;
      background: #fffdf9;
      background-image: 
        radial-gradient(#e8d8d0 1px, transparent 1px),
        linear-gradient(to bottom, #fffefb, #f7efe6);
      background-size: 16px 16px, 100% 100%;
      border-radius: 8px;
      padding: 34px 28px 28px 28px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(255, 120, 160, 0.38);
      position: relative;
      border: 1px solid #ebd9c8;
      transform: scale(0.92) translateY(20px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-backdrop.open .love-letter-card {
      transform: scale(1) translateY(0);
    }

    .letter-wax-seal {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #c42750, #7a0b26);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd1dc;
      font-size: 18px;
      border: 2px solid #a31135;
    }

    .letter-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: #9c8585;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .letter-close:hover {
      color: #d12e66;
    }

    .letter-title {
      font-family: 'Great Vibes', cursive;
      font-size: 34px;
      color: #8c1d40;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: 21px;
      line-height: 1.6;
      color: #3b2832;
      width: 100%;
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px dashed rgba(200, 150, 170, 0.35);
      padding: 18px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.55);
      white-space: pre-wrap;
      text-align: center;
    }

    /* Alt merkezde hafif romantik ipucu */
    .bottom-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 190, 220, 0.45);
      font-family: 'Caveat', cursive;
      font-size: 17px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
      animation: fadeInOut 4s infinite ease-in-out;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
      text-align: center;
      width: 90%;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }

    /* MOBİL KUSURSUZ UYUMLULUK */
    @media (max-width: 640px) {
      .letter-btn {
        top: 16px;
        right: 16px;
      }
      .glass-btn {
        padding: 8px 16px;
        font-size: 15px;
      }
      .love-letter-card {
        padding: 30px 20px 22px 20px;
        max-width: 92vw;
      }
      .letter-title {
        font-size: 27px;
        margin-top: 8px;
        margin-bottom: 12px;
      }
      .letter-body {
        font-size: 18px;
        padding: 14px 10px;
        line-height: 1.5;
      }
      .bottom-hint {
        bottom: 16px;
        font-size: 14px;
        width: 92%;
      }
    }
  </style>
</head>

<body>
  <!-- 3D Manolya Buketi Canvas -->
  <canvas id="c"></canvas>

  <!-- Uçuşan Manolya Yaprakları Katmanı -->
  <canvas id="fx-canvas"></canvas>

  <!-- Romantik Işık & Ambiyans -->
  <div class="ambient-glow"></div>

  <!-- SAĞ ÜST: SANA BİR MEKTUP VAR BUTONU -->
  <div class="letter-btn">
    <button class="glass-btn" id="openLetterBtn">
      <span>💌 Sana Bir Mektup Var</span>
    </button>
  </div>

  <!-- ALT ORTA İPUCU -->
  <div class="bottom-hint">
    Manolyaların yeniden açması için ekrana dokun
  </div>

  <!-- AŞK MEKTUBU MODALI (Özel Şiir) -->
  <div class="modal-backdrop" id="letterModal">
    <div class="love-letter-card">
      <div class="letter-wax-seal">✉</div>
      <button class="letter-close" id="closeLetterBtn">&times;</button>
      <div class="letter-title">Sana Bir Mektup Var</div>
      <div class="letter-body">Gözlerini gözlüyorum gözlerimde,
Gözlerin gözlerimin en derin gözünde...
Gözümün gözünü görmüyorsun lakin,
Gözlerim her zaman senin gözünde...

Seni çok seviyorum balımmmmm.</div>
    </div>
  </div>

  <!-- YEREL HTML5 AUDIO (Flört - Manolya: Doğrudan & Donmasız) -->
  <audio id="bgAudio" src="./manolya.mp3" preload="auto" loop></audio>

  <script>
    // =========================================================
    // 1. 3D ASCII MANOLYA (MAGNOLIA) BUKETİ MOTORU
    // =========================================================
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    const CW = 6;
    const CH = 10;
    const CHARS = ' .,:;+*?%S#@';

    let w = 0, h = 0, cols = 0, rows = 0;
    let zbuf, cbuf, colbuf;
    let stars = [];
    let t0 = null;

    // Arka plan metni: 5 M ile BALIMMMMM
    const bgCustomText = 'BALIMMMMM';

    // =========================================================
    // PARLAK & BELİRGİN MANOLYA ÇİÇEK BUKETİ
    // =========================================================
    const bouquet = [
      // 1. Merkez: Canlı Gül & Saf Porselen Manolya (Soulangeana)
      { x:  0.00, y:  0.34, z:  0.22, rx: -0.15, ry:  0.00, rot: 0.10, s: 0.38, c: [255,  55, 125], mid: [255, 225, 238], tip: [255, 255, 255], d: 0.00 },
      // 2. Sol Orta: Şarap & Mor Kadife Manolya (Nigra)
      { x: -0.28, y:  0.06, z:  0.34, rx: -0.05, ry: -0.22, rot: 0.35, s: 0.37, c: [230,  30,  95], mid: [255, 155, 195], tip: [255, 245, 250], d: 0.25 },
      // 3. Sağ Orta: Saf Porselen Beyazı Yıldız Manolyası (Stellata)
      { x:  0.29, y:  0.02, z:  0.32, rx: -0.05, ry:  0.22, rot: 0.20, s: 0.38, c: [250, 225, 235], mid: [255, 250, 252], tip: [255, 255, 255], d: 0.40 },
      // 4. Ön Alt: Narin Şeftali & Krem Manolya
      { x:  0.00, y: -0.20, z:  0.44, rx:  0.12, ry:  0.02, rot: 0.45, s: 0.35, c: [255, 110, 125], mid: [255, 220, 215], tip: [255, 252, 248], d: 0.55 },
      // 5. Sol Alt: Masum Pudra Pembesi Manolya
      { x: -0.45, y: -0.15, z:  0.15, rx:  0.05, ry: -0.35, rot: 0.15, s: 0.30, c: [245,  95, 155], mid: [255, 210, 230], tip: [255, 252, 255], d: 0.70 },
      // 6. Sağ Üst: Koyu Kadife Gül Manolyası
      { x:  0.46, y:  0.18, z:  0.14, rx: -0.10, ry:  0.35, rot: 0.50, s: 0.30, c: [225,  35,  85], mid: [255, 145, 180], tip: [255, 235, 245], d: 0.65 },
      // 7. Sol Üst: Açık Pembe İpek Manolya
      { x: -0.24, y:  0.44, z: -0.04, rx: -0.22, ry: -0.18, rot: 0.25, s: 0.28, c: [250, 130, 180], mid: [255, 220, 240], tip: [255, 255, 255], d: 0.85 },
      // 8. Sağ Tepe: Şampanya Porselen Manolya
      { x:  0.26, y:  0.42, z: -0.05, rx: -0.22, ry:  0.20, rot: 0.40, s: 0.28, c: [255, 145, 125], mid: [255, 235, 220], tip: [255, 255, 252], d: 0.90 },
      // 9. Sağ Alt: Derin Aşk Manolyası
      { x:  0.41, y: -0.26, z:  0.18, rx:  0.15, ry:  0.32, rot: 0.05, s: 0.28, c: [240,  45,  80], mid: [255, 165, 185], tip: [255, 245, 248], d: 1.00 }
    ];

    let currentScale = 0;
    let currentCenterY = 0;

    // Arka plan metni için optimize edilmiş offscreen canvas (0ms maliyet)
    const bgTextCanvas = document.createElement('canvas');
    const bgTextCtx = bgTextCanvas.getContext('2d');

    function renderBgTextCanvas() {
      bgTextCanvas.width = w;
      bgTextCanvas.height = h;
      bgTextCtx.clearRect(0, 0, w, h);

      const fontSize = Math.floor(Math.max(34, Math.min(w * 0.08, h * 0.10)));
      bgTextCtx.font = `600 ${fontSize}px "Dancing Script", "Playfair Display", cursive`;
      bgTextCtx.textAlign = 'left';
      bgTextCtx.textBaseline = 'top';

      const isMobile = w < 768;
      if (!isMobile) {
        bgTextCtx.shadowColor = 'rgba(255, 110, 160, 0.45)';
        bgTextCtx.shadowBlur = 12;
      }
      bgTextCtx.fillStyle = 'rgba(255, 195, 220, 0.13)';

      const text = bgCustomText + '   ';
      const stepX = bgTextCtx.measureText(text).width;
      const stepY = fontSize * 1.35;

      for (let y = -stepY, row = 0; y < h + stepY; y += stepY, row++) {
        const offsetX = (row % 2 === 0) ? 0 : -stepX * 0.5;
        for (let x = offsetX - stepX; x < w + stepX; x += stepX) {
          bgTextCtx.fillText(text, x, y);
        }
      }
    }

    if (document.fonts) {
      document.fonts.ready.then(() => {
        renderBgTextCanvas();
      });
    }

    function setup() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

      fxCanvas.width = w;
      fxCanvas.height = h;

      cols = Math.max(1, Math.floor(w / CW));
      rows = Math.max(1, Math.floor(h / CH));
      const len = cols * rows;

      zbuf = new Float32Array(len);
      cbuf = new Array(len);
      colbuf = new Array(len);

      const isMobile = w < 768;
      stars = [];
      const starCount = isMobile ? 45 : 90;
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          p: Math.random() * 6.28,
          sp: 0.6 + Math.random() * 1.4,
          isPink: Math.random() > 0.55
        });
      }

      renderBgTextCanvas();
      initParticles();
      initSparkles();
      bursts = [];
      shockwaves = [];
    }

    function put(wx, wy, wz, ch, r, g, b) {
      const sx = Math.floor((w * 0.5 + wx * currentScale) / CW);
      const sy = Math.floor((currentCenterY - wy * currentScale) / CH);
      if (sx < 0 || sx >= cols || sy < 0 || sy >= rows) return;

      const i = sy * cols + sx;
      if (wz > zbuf[i]) {
        zbuf[i] = wz;
        cbuf[i] = ch;
        const rr = r > 255 ? 255 : (r < 0 ? 0 : r | 0);
        const gg = g > 255 ? 255 : (g < 0 ? 0 : g | 0);
        const bb = b > 255 ? 255 : (b < 0 ? 0 : b | 0);
        colbuf[i] = `rgb(${rr},${gg},${bb})`;
      }
    }

    function rotXY(x, y, z, ax, ay) {
      const cx = Math.cos(ax), sx = Math.sin(ax);
      const y1 = y * cx - z * sx;
      const z1 = y * sx + z * cx;

      const cy = Math.cos(ay), sy = Math.sin(ay);
      const x2 = x * cy + z1 * sy;
      const z2 = -x * sy + z1 * cy;

      return [x2, y1, z2];
    }

    function drawWrapper(sway, isMobile) {
      const pinchY = -0.58;
      const yStep = isMobile ? 0.022 : 0.014;
      const xStep = isMobile ? 0.018 : 0.011;

      for (let y = -0.90; y <= 0.64; y += yStep) {
        let halfW;
        if (y >= pinchY) {
          const t = (y - pinchY) / (0.64 - pinchY);
          halfW = 0.13 + Math.pow(t, 0.85) * 0.64;
        } else {
          const t = (pinchY - y) / (pinchY - (-0.90));
          halfW = 0.13 + t * 0.14;
        }

        const topEdge = 0.60 + Math.sin((y + 1) * 3) * 0.02;

        for (let x = -halfW; x <= halfW; x += xStep) {
          const nx = x / halfW;
          const arch = y > 0.42 ? (1 - nx * nx) * 0.08 : 0;
          if (y > topEdge + arch) continue;

          const fold = Math.sin(nx * 11) * 0.14 + Math.cos(nx * 4.5) * 0.12;
          const edge = 1 - Math.abs(nx) * 0.28;
          const vFade = y < pinchY ? 0.65 : 0.72 + ((y - pinchY) / 1.2) * 0.25;
          const shade = Math.max(0.25, Math.min(0.95, (0.58 + fold) * edge * vFade));
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 2)))];

          const wx = x + sway * (y > pinchY ? (y - pinchY) * 0.45 : 0);
          put(wx, y, -0.35 + fold * 0.05, ch, 210 * shade, 150 * shade, 135 * shade);
        }
      }

      for (let y = -0.90; y <= -0.18; y += yStep) {
        let halfW;
        if (y >= pinchY) {
          const t = (y - pinchY) / (-0.18 - pinchY);
          halfW = 0.135 + t * 0.34;
        } else {
          const t = (pinchY - y) / (pinchY - (-0.90));
          halfW = 0.135 + t * 0.145;
        }

        for (let x = -halfW; x <= halfW; x += xStep) {
          const nx = x / halfW;
          const vCut = -0.34 + Math.abs(nx) * 0.18;
          if (y > vCut) continue;

          const fold = Math.cos(nx * 8) * 0.12;
          const centerLight = 1 - Math.abs(nx) * 0.32;
          const shade = Math.max(0.32, Math.min(1.0, (0.68 + fold) * centerLight));
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 1)))];

          const wx = x + sway * (y > pinchY ? (y - pinchY) * 0.3 : 0);
          put(wx, y, 0.34 + (1 - Math.abs(nx)) * 0.04, ch, 240 * shade, 180 * shade, 160 * shade);
        }
      }

      // Kurdele Kemeri
      for (let y = pinchY - 0.032; y <= pinchY + 0.032; y += 0.01) {
        for (let x = -0.15; x <= 0.15; x += 0.01) {
          const nx = x / 0.15;
          const shade = 0.65 + (1 - Math.abs(nx)) * 0.35;
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 1)))];
          put(x, y, 0.45, ch, 245 * shade, 35 * shade, 75 * shade);
        }
      }

      // Fiyonk
      for (const side of [-1, 1]) {
        for (let t = 0; t <= Math.PI * 2; t += 0.08) {
          for (let r = 0.35; r <= 1.0; r += 0.2) {
            const bx = side * (0.04 + Math.abs(Math.cos(t)) * 0.15 * r);
            const by = pinchY + Math.sin(t) * 0.065 * r - Math.abs(Math.cos(t)) * 0.015;
            const shade = 0.6 + 0.4 * r;
            const ch = shade > 0.8 ? '#' : '+';
            put(bx, by, 0.46 + r * 0.02, ch, 255 * shade, 40 * shade, 85 * shade);
          }
        }
      }

      // Sarkan Şeritler
      for (const side of [-1, 1]) {
        for (let u = 0; u <= 1; u += 0.025) {
          const tx = side * (0.03 + u * 0.11 + Math.sin(u * 4) * 0.015);
          const ty = pinchY - 0.02 - u * 0.26;
          for (let dx = -0.018; dx <= 0.018; dx += 0.009) {
            const shade = 0.72 + (1 - u * 0.3) * 0.25;
            put(tx + dx, ty, 0.46, '%', 245 * shade, 30 * shade, 65 * shade);
          }
        }
      }
    }

    function stem(f, sway, isMobile) {
      const bx = f.x * 0.12;
      const by = -0.88;
      const bz = f.z * 0.12 - 0.15;
      const tx = f.x + sway;
      const ty = f.y;
      const tz = f.z - 0.08;

      const stemSteps = isMobile ? 38 : 70;
      for (let i = 0; i <= stemSteps; i++) {
        const t = i / stemSteps;
        const cx = bx + (tx - bx) * t + Math.sin(t * Math.PI) * f.x * 0.08;
        const cy = by + (ty - by) * t;
        const cz = bz + (tz - bz) * t;
        const l = 0.45 + 0.55 * t;
        put(cx, cy, cz, '|', 85 * l, 165 * l, 75 * l);
        put(cx + 0.007, cy, cz, ':', 55 * l, 125 * l, 50 * l);
      }

      const leafUStep = isMobile ? 0.038 : 0.022;
      const leafVStep = isMobile ? 0.35 : 0.22;
      for (const side of [-1, 1]) {
        const st = 0.24 + (side > 0 ? 0.12 : 0);
        const ox = bx + (tx - bx) * st;
        const oy = by + (ty - by) * st;
        const oz = bz + (tz - bz) * st;

        for (let u = 0; u <= 1; u += leafUStep) {
          const lw = Math.sin(u * Math.PI) * 0.055;
          for (let v = -1; v <= 1; v += leafVStep) {
            const lx = ox + side * (u * 0.26) + v * lw * 0.25;
            const ly = oy + Math.sin(u * Math.PI * 0.78) * 0.20 + v * lw;
            const lz = oz + u * 0.08;
            const l = 0.48 + 0.52 * (1 - Math.abs(v) * 0.45);
            const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(l * CHARS.length))];
            put(lx, ly, lz, ch, 45 * l, 195 * l, 85 * l);
          }
        }
      }
    }

    // 3D Belirgin & Romantik Manolya (Magnolia) Çiçekleri (Optimize Edilmiş)
    function manolya(f, bloom, sway, sec, isMobile) {
      const fx = f.x + sway;
      const fy = f.y;
      const fz = f.z;
      const [r1, g1, b1] = f.c;
      const [rm, gm, bm] = f.mid;
      const [r2, g2, b2] = f.tip;

      const uStep = isMobile ? 0.024 : 0.014;
      const vStep = isMobile ? 0.16 : 0.09;

      for (let p = 0; p < 8; p++) {
        const inner = (p & 1) === 1;
        const ang = f.rot + (p / 8) * Math.PI * 2 + Math.sin(sec * 0.65 + p) * 0.012;
        const ca = Math.cos(ang), sa = Math.sin(ang);

        for (let u = 0.035; u <= 1.0; u += uStep) {
          const pw = Math.sin(Math.pow(u, 0.60) * Math.PI) * (inner ? 0.38 : 0.46) * f.s;
          const rDist = u * f.s * (inner ? 0.24 + 0.74 * bloom : 0.26 + 0.90 * bloom);
          const zCurve = f.s * ((1 - bloom) * 0.52 * u + bloom * (0.25 * Math.sin(u * Math.PI * 0.95) + (inner ? 0.17 : 0.07) * u * u));
          const zLayer = inner ? 0.02 : -0.02;

          for (let v = -1; v <= 1; v += vStep) {
            const lx = rDist * ca - (v * pw) * sa;
            const ly = rDist * sa + (v * pw) * ca;
            const lz = zCurve + zLayer - Math.abs(v) * 0.045 * f.s;

            const [rx, ry, rz] = rotXY(lx, ly, lz, f.rx, f.ry);

            const centerMix = Math.exp(-u * 3.8);
            const tipMix = Math.pow(u, 1.7);
            const vein = Math.exp(-Math.abs(v) * 6.0) * 0.24;
            const shade = Math.max(0.48, Math.min(1.28, 0.66 + (rz / f.s) * 0.35 + (1 - Math.abs(v) * 0.30) * 0.25 + vein));

            const chIdx = Math.min(CHARS.length - 1, Math.floor(Math.min(0.99, shade) * CHARS.length));

            const br = r1 * (1 - centerMix) + rm * centerMix;
            const bg = g1 * (1 - centerMix) + gm * centerMix;
            const bb = b1 * (1 - centerMix) + bm * centerMix;

            const rr = (br * (1 - tipMix) + r2 * tipMix) * shade;
            const gg = (bg * (1 - tipMix) + g2 * tipMix) * shade;
            const bb2 = (bb * (1 - tipMix) + b2 * tipMix) * shade;

            put(fx + rx, fy + ry, fz + rz, CHARS[chIdx], rr, gg, bb2);
          }
        }
      }

      // Manolyanın ortasındaki belirgin polen konisi & altın ışıltılar
      if (bloom > 0.22) {
        const stamens = isMobile ? 8 : 12;
        for (let s = 0; s < stamens; s++) {
          const sa = f.rot + (s / stamens) * Math.PI * 2 + 0.25;
          for (let t = 0.20; t <= 0.98; t += 0.26) {
            const sx = Math.cos(sa) * 0.095 * t * f.s * bloom;
            const sy = Math.sin(sa) * 0.095 * t * f.s * bloom;
            const sz = 0.24 * t * f.s * bloom + 0.035;
            const [rx, ry, rz] = rotXY(sx, sy, sz, f.rx, f.ry);
            const isApex = t > 0.70;
            put(fx + rx, fy + ry, fz + rz, isApex ? '*' : ':', isApex ? 255 : 245, isApex ? 220 : 210, isApex ? 165 : 85);
          }
        }
      }
    }

    // =========================================================
    // 3. UÇUŞAN MANOLYA YAPRAKLARI, PERİ TOZU & İNTERAKTİF PATLAMA
    // =========================================================
    let petals = [];
    let sparkles = [];
    let bursts = [];
    let shockwaves = [];

    function initParticles() {
      petals = [];
      const isMobile = w < 768;
      const count = isMobile ? 18 : Math.min(32, Math.floor(w / 40));
      for (let i = 0; i < count; i++) {
        petals.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: 7 + Math.random() * 9,
          speedY: 0.6 + Math.random() * 1.1,
          speedX: (Math.random() - 0.5) * 0.7,
          vx: 0,
          vy: 0,
          angle: Math.random() * Math.PI * 2,
          angularSpeed: (Math.random() - 0.5) * 0.035,
          opacity: 0.25 + Math.random() * 0.50,
          color: Math.random() > 0.5 ? 'rgba(255, 235, 245,' : 'rgba(255, 160, 195,'
        });
      }
    }

    function initSparkles() {
      sparkles = [];
      const isMobile = w < 768;
      const count = isMobile ? 14 : 24;
      for (let i = 0; i < count; i++) {
        sparkles.push({
          x: w * 0.5 + (Math.random() - 0.5) * (w < 640 ? w * 0.75 : 360),
          y: h * 0.52 + (Math.random() - 0.5) * 180,
          vy: -(0.3 + Math.random() * 0.6),
          vx: 0,
          extraVy: 0,
          size: 1.8 + Math.random() * 2.8,
          alpha: Math.random(),
          sp: 1 + Math.random() * 2
        });
      }
    }

    // Tıklanan / Dokunulan noktadan parçacıkları dışa doğru savurma ve ışıltı patlatma
    function triggerInteractiveBlast(cx, cy) {
      const isMobile = w < 768;

      // 1. Mevcut süzülen yaprakları şiddetle dışa doğru savur / dağıt
      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const blastRadius = Math.max(w, h) * 0.75;
        if (dist < blastRadius) {
          const power = Math.pow(1 - dist / blastRadius, 1.2) * 28;
          p.vx += (dx / dist) * power;
          p.vy += (dy / dist) * power - 2.5; // hafif yukarı sıçrama
          p.angularSpeed = (Math.random() - 0.5) * 0.22;
        }
      }

      // 2. Peri tozlarını savur
      for (let i = 0; i < sparkles.length; i++) {
        const s = sparkles[i];
        const dx = s.x - cx;
        const dy = s.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const blastRadius = Math.max(w, h) * 0.65;
        if (dist < blastRadius) {
          const power = (1 - dist / blastRadius) * 22;
          s.vx += (dx / dist) * power;
          s.extraVy += (dy / dist) * power;
        }
      }

      // 3. Tıklanan noktadan çevreye yayılan ışıltılı şok dalgası halkası
      shockwaves.push({
        x: cx,
        y: cy,
        r: 6,
        maxR: Math.min(w, h) * 0.42,
        alpha: 0.85
      });

      // 4. Tıklanan noktadan 360 derece patlayan mini manolya yaprakları & peri tozu
      const burstCount = isMobile ? 18 : 32;
      for (let i = 0; i < burstCount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2.0 + Math.random() * 9.5;
        bursts.push({
          x: cx,
          y: cy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.0,
          size: 2.2 + Math.random() * 5.8,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.28,
          alpha: 1.0,
          decay: 0.012 + Math.random() * 0.016,
          isPetal: Math.random() > 0.45,
          color: Math.random() > 0.5 ? '255, 235, 245' : (Math.random() > 0.4 ? '255, 175, 210' : '255, 225, 175')
        });
      }
    }

    function drawFX() {
      fxCtx.clearRect(0, 0, w, h);
      const isMobile = w < 768;

      // A) Şok Dalgası Halkaları
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += 6.5;
        sw.alpha -= 0.024;
        if (sw.alpha <= 0 || sw.r >= sw.maxR) {
          shockwaves.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        fxCtx.strokeStyle = `rgba(255, 185, 215, ${sw.alpha * 0.55})`;
        fxCtx.lineWidth = 2.2;
        if (!isMobile) {
          fxCtx.shadowColor = 'rgba(255, 120, 180, 0.7)';
          fxCtx.shadowBlur = 10;
        }
        fxCtx.stroke();
        fxCtx.restore();
      }

      // B) İnteraktif Patlama Parçacıkları (Tıklanınca Saçılanlar)
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.vx *= 0.94;
        b.vy *= 0.94;
        b.vy += 0.09; // hafif yerçekimi süzülmesi
        b.x += b.vx;
        b.y += b.vy;
        b.rot += b.vRot;
        b.alpha -= b.decay;

        if (b.alpha <= 0) {
          bursts.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.translate(b.x, b.y);
        fxCtx.rotate(b.rot);
        fxCtx.fillStyle = `rgba(${b.color}, ${b.alpha})`;
        if (!isMobile) {
          fxCtx.shadowColor = 'rgba(255, 140, 190, 0.65)';
          fxCtx.shadowBlur = 7;
        }

        if (b.isPetal) {
          fxCtx.beginPath();
          fxCtx.ellipse(0, 0, b.size * 1.5, b.size * 0.85, 0, 0, Math.PI * 2);
          fxCtx.fill();
        } else {
          fxCtx.beginPath();
          fxCtx.arc(0, 0, b.size * 0.65, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.restore();
      }

      // C) Süzülen Manolya Yaprakları (Savrulma Fiziğiyle)
      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.vx = (p.vx || 0) * 0.93; // sürtünmeyle normale dönüş
        p.vy = (p.vy || 0) * 0.93;
        p.y += p.speedY + p.vy;
        p.x += Math.sin(p.angle) * 0.8 + p.speedX + p.vx;
        p.angle += p.angularSpeed;

        if (p.y > h + 25) {
          p.y = -25;
          p.x = Math.random() * w;
        } else if (p.y < -30) {
          p.y = h + 10;
        }
        if (p.x < -30) p.x = w + 10;
        else if (p.x > w + 30) p.x = -10;

        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.angle);
        fxCtx.fillStyle = `${p.color}${p.opacity})`;
        if (!isMobile) {
          fxCtx.shadowColor = 'rgba(255, 140, 180, 0.4)';
          fxCtx.shadowBlur = 6;
        }

        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size * 1.4, p.size * 0.85, 0, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      // D) Manolyalardan Yükselen Peri Tozu (Fairy Dust)
      for (let i = 0; i < sparkles.length; i++) {
        const s = sparkles[i];
        s.vx = (s.vx || 0) * 0.92;
        s.extraVy = (s.extraVy || 0) * 0.92;
        s.y += s.vy + s.extraVy;
        s.x += s.vx;
        s.alpha = 0.3 + 0.6 * (0.5 + 0.5 * Math.sin(Date.now() * 0.003 * s.sp + i));
        if (s.y < h * 0.20) {
          s.y = h * 0.65 + Math.random() * 60;
          s.x = w * 0.5 + (Math.random() - 0.5) * (w < 640 ? w * 0.75 : 360);
          s.vx = 0;
          s.extraVy = 0;
        }
        fxCtx.fillStyle = `rgba(255, 220, 180, ${s.alpha * 0.85})`;
        if (!isMobile) {
          fxCtx.shadowColor = '#ffb3c6';
          fxCtx.shadowBlur = 8;
        }
        fxCtx.beginPath();
        fxCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        fxCtx.fill();
      }
    }

    // =========================================================
    // 4. ANA ANİMASYON DÖNGÜSÜ (60 FPS / 120 FPS KESİNTİSİZ AKICI)
    // =========================================================
    function frame(now) {
      if (t0 === null) t0 = now;
      const sec = Math.max(0, (now - t0) / 1000);
      const isMobile = w < 768;

      currentScale = isMobile ? Math.min(w, h) * 0.54 : Math.min(w, h) * 0.49;
      currentCenterY = h * (isMobile ? 0.53 : 0.51);

      zbuf.fill(-1e9);
      cbuf.fill(null);

      ctx.fillStyle = '#040206';
      ctx.fillRect(0, 0, w, h);

      // Yıldızlar & Parıltılar
      ctx.font = `bold ${CH}px "Courier New", monospace`;
      ctx.textBaseline = 'top';
      for (let i = 0; i < stars.length; i++) {
        const d = stars[i];
        const a = 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(sec * d.sp + d.p));
        ctx.fillStyle = d.isPink ? `rgba(255,180,210,${a.toFixed(2)})` : `rgba(255,255,255,${a.toFixed(2)})`;
        ctx.fillText(d.isPink ? '*' : '.', d.x, d.y);
      }

      // Arka Plan Metni: Önceden bellekte hazırlanan tek seferlik çizim (0.02ms)
      ctx.drawImage(bgTextCanvas, 0, 0);

      // Buket ve Manolyalar
      const globalSway = Math.sin(sec * 0.8) * 0.015;
      drawWrapper(globalSway, isMobile);

      // Çiçeklerin daha yavaş, kademeli ve zarif açılması (5.2 saniye)
      const bloomDuration = 5.2;
      for (let i = 0; i < bouquet.length; i++) {
        const f = bouquet[i];
        const sway = globalSway + Math.sin(sec * 0.9 + i * 0.85) * 0.012;
        const p = Math.max(0, Math.min(1, (sec - f.d * 1.5) / bloomDuration));
        const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const bloom = 0.08 + 0.92 * ease;

        stem(f, sway, isMobile);
        manolya(f, bloom, sway, sec, isMobile);
      }

      // Z-Buffer Çizimi (Yüksek Performanslı & Sıfır Donma)
      let lastFill = '';
      for (let y = 0; y < rows; y++) {
        const off = y * cols;
        const py = y * CH;
        for (let x = 0; x < cols; x++) {
          const i = off + x;
          const ch = cbuf[i];
          if (ch) {
            const col = colbuf[i];
            if (lastFill !== col) {
              ctx.fillStyle = col;
              lastFill = col;
            }
            ctx.fillText(ch, x * CW, py);
          }
        }
      }

      drawFX();
      requestAnimationFrame(frame);
    }

    // =========================================================
    // 5. ŞARKI: FLÖRT - MANOLYA (DOĞRUDAN HTML5 AUDIO & ANINDA ÇALMA)
    // =========================================================
    const bgAudio = document.getElementById('bgAudio');
    bgAudio.volume = 0.85;

    function playAudioInstant() {
      if (bgAudio.paused) {
        bgAudio.play().catch(() => {});
      }
    }

    window.addEventListener('DOMContentLoaded', playAudioInstant);
    window.addEventListener('load', playAudioInstant);
    window.addEventListener('click', playAudioInstant, { passive: true });
    window.addEventListener('touchstart', playAudioInstant, { passive: true });
    window.addEventListener('keydown', playAudioInstant, { passive: true });

    // =========================================================
    // 6. AŞK MEKTUBU MODALI & SES KISMA DOKUNUŞU (%50 SEVİYESİNE)
    // =========================================================
    const openLetterBtn = document.getElementById('openLetterBtn');
    const letterModal = document.getElementById('letterModal');
    const closeLetterBtn = document.getElementById('closeLetterBtn');

    let volumeFadeInterval = null;
    function fadeAudioVolume(targetVol, durationMs = 350) {
      if (!bgAudio) return;
      if (volumeFadeInterval) clearInterval(volumeFadeInterval);
      const startVol = bgAudio.volume;
      const startTime = performance.now();
      volumeFadeInterval = setInterval(() => {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(1, elapsed / durationMs);
        bgAudio.volume = startVol + (targetVol - startVol) * progress;
        if (progress >= 1) {
          clearInterval(volumeFadeInterval);
          volumeFadeInterval = null;
        }
      }, 20);
    }

    openLetterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      letterModal.classList.add('open');
      fadeAudioVolume(0.50); // Şiiri okurken fon müziği tam %50 seviyesine iner
    });

    closeLetterBtn.addEventListener('click', () => {
      letterModal.classList.remove('open');
      fadeAudioVolume(0.85); // Mektup kapanınca ses eski canlılığına (%85) döner
    });

    letterModal.addEventListener('click', (e) => {
      if (e.target === letterModal) {
        letterModal.classList.remove('open');
        fadeAudioVolume(0.85);
      }
    });

    // =========================================================
    // 7. ETKİLEŞİM: TIKLAYINCA SAVRULAN PARÇACIKLAR & AÇAN MANOLYALAR
    // =========================================================
    let lastInteractionTime = 0;

    function handleScreenInteraction(e) {
      // Mektup kartı veya mektup açma butonuna tıklandığında engelle
      if (e.target.closest('.love-letter-card') || e.target.closest('.glass-btn')) {
        return;
      }

      const now = Date.now();
      if (now - lastInteractionTime < 100) return; // Çift tetiklemeyi önle
      lastInteractionTime = now;

      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : w * 0.5);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : h * 0.5);

      // 1. Manolyaları baştan yavaşça açması için sıfırla
      t0 = null;

      // 2. Havada uçuşan yaprakları ve peri tozlarını tıklanan noktadan savur + patlama çıkar
      triggerInteractiveBlast(clientX, clientY);

      // 3. Şarkı başlamamışsa anında başlat
      playAudioInstant();
    }

    window.addEventListener('pointerdown', handleScreenInteraction);

    window.addEventListener('resize', setup);

    // BAŞLAT
    setup();
    requestAnimationFrame(frame);
  </script>
</body>
