<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lily_bouquet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const CW = 6;
    const CH = 10;
    const CHARS = ' .,:;+*?%S#@';

    let w = 0, h = 0, cols = 0, rows = 0;
    let zbuf, cbuf, colbuf;
    let stars = [];
    let t0 = null;

    const bouquet = [
      { x:  0.00, y:  0.34, z:  0.22, rx: -0.15, ry:  0.00, rot: 0.10, s: 0.35, c: [255,  30,  55], mid: [160,  15,  25], tip: [255, 110, 125], d: 0.00 },
      { x: -0.28, y:  0.06, z:  0.34, rx: -0.05, ry: -0.22, rot: 0.35, s: 0.34, c: [255,  45, 175], mid: [175,  20, 110], tip: [255, 160, 230], d: 0.25 },
      { x:  0.29, y:  0.02, z:  0.32, rx: -0.05, ry:  0.22, rot: 0.20, s: 0.35, c: [250, 240, 235], mid: [185, 165, 150], tip: [255, 255, 255], d: 0.40 },
      { x:  0.00, y: -0.20, z:  0.44, rx:  0.12, ry:  0.02, rot: 0.45, s: 0.32, c: [255, 145,  85], mid: [185,  75,  35], tip: [255, 225, 175], d: 0.55 },
      { x: -0.45, y: -0.15, z:  0.15, rx:  0.05, ry: -0.35, rot: 0.15, s: 0.27, c: [255, 215,  35], mid: [185, 130,  15], tip: [255, 250, 155], d: 0.70 },
      { x:  0.46, y:  0.18, z:  0.14, rx: -0.10, ry:  0.35, rot: 0.50, s: 0.27, c: [235,  30, 115], mid: [145,  15,  65], tip: [255, 125, 180], d: 0.65 },
      { x: -0.24, y:  0.44, z: -0.04, rx: -0.22, ry: -0.18, rot: 0.25, s: 0.25, c: [255, 200, 215], mid: [185, 120, 135], tip: [255, 245, 250], d: 0.85 },
      { x:  0.26, y:  0.42, z: -0.05, rx: -0.22, ry:  0.20, rot: 0.40, s: 0.25, c: [255, 185,  45], mid: [180, 105,  20], tip: [255, 240, 145], d: 0.90 },
      { x:  0.41, y: -0.26, z:  0.18, rx:  0.15, ry:  0.32, rot: 0.05, s: 0.25, c: [245,  35,  45], mid: [150,  15,  20], tip: [255, 125,  95], d: 1.00 }
    ];

    function setup() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

      cols = Math.max(1, Math.floor(w / CW));
      rows = Math.max(1, Math.floor(h / CH));
      const len = cols * rows;

      zbuf = new Float32Array(len);
      cbuf = new Array(len);
      colbuf = new Array(len);

      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          p: Math.random() * 6.28,
          sp: 0.6 + Math.random() * 1.4
        });
      }
    }

    function put(wx, wy, wz, ch, r, g, b) {
      const scale = Math.min(w, h) * 0.46;
      const sx = Math.floor((w * 0.5 + wx * scale) / CW);
      const sy = Math.floor((h * 0.52 - wy * scale) / CH);
      if (sx < 0 || sx >= cols || sy < 0 || sy >= rows) return;

      const i = sy * cols + sx;
      if (wz > zbuf[i]) {
        zbuf[i] = wz;
        cbuf[i] = ch;
        const rr = r > 255 ? 255 : (r < 0 ? 0 : r | 0);
        const gg = g > 255 ? 255 : (g < 0 ? 0 : g | 0);
        const bb = b > 255 ? 255 : (b < 0 ? 0 : b | 0);
        colbuf[i] = `rgb(${rr},${gg},${bb})`;
      }
    }

    function rotXY(x, y, z, ax, ay) {
      const cx = Math.cos(ax), sx = Math.sin(ax);
      const y1 = y * cx - z * sx;
      const z1 = y * sx + z * cx;

      const cy = Math.cos(ay), sy = Math.sin(ay);
      const x2 = x * cy + z1 * sy;
      const z2 = -x * sy + z1 * cy;

      return [x2, y1, z2];
    }

    function drawWrapper(sway) {
      const pinchY = -0.58;

      // Arka buket kagidi (kraft / krem ton)
      for (let y = -0.90; y <= 0.64; y += 0.014) {
        let halfW;
        if (y >= pinchY) {
          const t = (y - pinchY) / (0.64 - pinchY);
          halfW = 0.13 + Math.pow(t, 0.85) * 0.64;
        } else {
          const t = (pinchY - y) / (pinchY - (-0.90));
          halfW = 0.13 + t * 0.14;
        }

        // Ust kenarda kagit kivrimi dalgasi
        const topEdge = 0.60 + Math.sin((y + 1) * 3) * 0.02;

        for (let x = -halfW; x <= halfW; x += 0.011) {
          const nx = x / halfW;
          const arch = y > 0.42 ? (1 - nx * nx) * 0.08 : 0;
          if (y > topEdge + arch) continue;

          // Kagit katlama golgeleri
          const fold = Math.sin(nx * 11) * 0.14 + Math.cos(nx * 4.5) * 0.12;
          const edge = 1 - Math.abs(nx) * 0.28;
          const vFade = y < pinchY ? 0.65 : 0.72 + ((y - pinchY) / 1.2) * 0.25;
          const shade = Math.max(0.25, Math.min(0.95, (0.58 + fold) * edge * vFade));
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 2)))];

          const wx = x + sway * (y > pinchY ? (y - pinchY) * 0.45 : 0);
          put(wx, y, -0.35 + fold * 0.05, ch, 195 * shade, 155 * shade, 118 * shade);
        }
      }

      // On buket kagidi (saplari saran V kesim)
      for (let y = -0.90; y <= -0.18; y += 0.014) {
        let halfW;
        if (y >= pinchY) {
          const t = (y - pinchY) / (-0.18 - pinchY);
          halfW = 0.135 + t * 0.34;
        } else {
          const t = (pinchY - y) / (pinchY - (-0.90));
          halfW = 0.135 + t * 0.145;
        }

        for (let x = -halfW; x <= halfW; x += 0.011) {
          const nx = x / halfW;
          // Ust kisimda capraz V yaka kesimi
          const vCut = -0.34 + Math.abs(nx) * 0.18;
          if (y > vCut) continue;

          const fold = Math.cos(nx * 8) * 0.12;
          const centerLight = 1 - Math.abs(nx) * 0.32;
          const shade = Math.max(0.32, Math.min(1.0, (0.68 + fold) * centerLight));
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 1)))];

          const wx = x + sway * (y > pinchY ? (y - pinchY) * 0.3 : 0);
          put(wx, y, 0.34 + (1 - Math.abs(nx)) * 0.04, ch, 225 * shade, 185 * shade, 145 * shade);
        }
      }

      // Kurdele bagi
      for (let y = pinchY - 0.032; y <= pinchY + 0.032; y += 0.01) {
        for (let x = -0.15; x <= 0.15; x += 0.01) {
          const nx = x / 0.15;
          const shade = 0.65 + (1 - Math.abs(nx)) * 0.35;
          const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(shade * (CHARS.length - 1)))];
          put(x, y, 0.45, ch, 235 * shade, 28 * shade, 55 * shade);
        }
      }

      // Fiyonk kulaklari
      for (const side of [-1, 1]) {
        for (let t = 0; t <= Math.PI * 2; t += 0.08) {
          for (let r = 0.35; r <= 1.0; r += 0.2) {
            const bx = side * (0.04 + Math.abs(Math.cos(t)) * 0.15 * r);
            const by = pinchY + Math.sin(t) * 0.065 * r - Math.abs(Math.cos(t)) * 0.015;
            const shade = 0.6 + 0.4 * r;
            const ch = shade > 0.8 ? '#' : '+';
            put(bx, by, 0.46 + r * 0.02, ch, 245 * shade, 32 * shade, 62 * shade);
          }
        }
      }

      // Sarkan kurdele uclari
      for (const side of [-1, 1]) {
        for (let u = 0; u <= 1; u += 0.025) {
          const tx = side * (0.03 + u * 0.11 + Math.sin(u * 4) * 0.015);
          const ty = pinchY - 0.02 - u * 0.26;
          for (let dx = -0.018; dx <= 0.018; dx += 0.009) {
            const shade = 0.72 + (1 - u * 0.3) * 0.25;
            put(tx + dx, ty, 0.46, '%', 235 * shade, 25 * shade, 52 * shade);
          }
        }
      }
    }

    function stem(f, sway) {
      const bx = f.x * 0.12;
      const by = -0.88;
      const bz = f.z * 0.12 - 0.15;
      const tx = f.x + sway;
      const ty = f.y;
      const tz = f.z - 0.08;

      for (let i = 0; i <= 70; i++) {
        const t = i / 70;
        const cx = bx + (tx - bx) * t + Math.sin(t * Math.PI) * f.x * 0.08;
        const cy = by + (ty - by) * t;
        const cz = bz + (tz - bz) * t;
        const l = 0.45 + 0.55 * t;
        put(cx, cy, cz, '|', 35 * l, 205 * l, 70 * l);
        put(cx + 0.007, cy, cz, ':', 22 * l, 150 * l, 48 * l);
      }

      for (const side of [-1, 1]) {
        const st = 0.24 + (side > 0 ? 0.12 : 0);
        const ox = bx + (tx - bx) * st;
        const oy = by + (ty - by) * st;
        const oz = bz + (tz - bz) * st;

        for (let u = 0; u <= 1; u += 0.022) {
          const lw = Math.sin(u * Math.PI) * 0.048;
          for (let v = -1; v <= 1; v += 0.22) {
            const lx = ox + side * (u * 0.26) + v * lw * 0.25;
            const ly = oy + Math.sin(u * Math.PI * 0.78) * 0.20 + v * lw;
            const lz = oz + u * 0.08;
            const l = 0.48 + 0.52 * (1 - Math.abs(v) * 0.45);
            const ch = CHARS[Math.min(CHARS.length - 1, Math.floor(l * CHARS.length))];
            put(lx, ly, lz, ch, 40 * l, 220 * l, 75 * l);
          }
        }
      }
    }

    function lily(f, bloom, sway, sec) {
      const fx = f.x + sway;
      const fy = f.y;
      const fz = f.z;
      const [r1, g1, b1] = f.c;
      const [rm, gm, bm] = f.mid;
      const [r2, g2, b2] = f.tip;

      for (let p = 0; p < 6; p++) {
        const outer = (p & 1) === 0;
        const ang = f.rot + (p / 6) * Math.PI * 2 + Math.sin(sec * 0.65 + p) * 0.012;
        const ca = Math.cos(ang), sa = Math.sin(ang);

        for (let u = 0.03; u <= 1.0; u += 0.016) {
          const pw = Math.sin(Math.pow(u, 0.85) * Math.PI) * (outer ? 0.29 : 0.26) * f.s;
          const rDist = u * f.s * (0.22 + 0.82 * bloom);
          const zCurve = f.s * ((1 - bloom) * 0.42 * u + bloom * (0.16 * Math.sin(u * Math.PI) - 0.08 * u * u));
          const zLayer = outer ? -0.015 : 0.015;

          for (let v = -1; v <= 1; v += 0.1) {
            const lx = rDist * ca - (v * pw) * sa;
            const ly = rDist * sa + (v * pw) * ca;
            const lz = zCurve + zLayer - Math.abs(v) * 0.035 * f.s;

            const [rx, ry, rz] = rotXY(lx, ly, lz, f.rx, f.ry);

            const centerMix = Math.exp(-u * 4.5);
            const tipMix = Math.pow(u, 2.2);
            const vein = Math.exp(-Math.abs(v) * 7.5) * 0.26;
            const shade = Math.max(0.42, Math.min(1.2, 0.58 + (rz / f.s) * 0.35 + (1 - Math.abs(v) * 0.35) * 0.25 + vein));

            const chIdx = Math.min(CHARS.length - 1, Math.floor(Math.min(0.99, shade) * CHARS.length));

            const br = r1 * (1 - centerMix) + rm * centerMix;
            const bg = g1 * (1 - centerMix) + gm * centerMix;
            const bb = b1 * (1 - centerMix) + bm * centerMix;

            const rr = (br * (1 - tipMix) + r2 * tipMix) * shade;
            const gg = (bg * (1 - tipMix) + g2 * tipMix) * shade;
            const bb2 = (bb * (1 - tipMix) + b2 * tipMix) * shade;

            put(fx + rx, fy + ry, fz + rz, CHARS[chIdx], rr, gg, bb2);
          }
        }
      }

      if (bloom > 0.3) {
        for (let s = 0; s < 6; s++) {
          const sa = f.rot + (s / 6) * Math.PI * 2 + 0.3;
          for (let t = 0.25; t <= 1.0; t += 0.35) {
            const sx = Math.cos(sa) * 0.11 * t * f.s * bloom;
            const sy = Math.sin(sa) * 0.11 * t * f.s * bloom;
            const sz = 0.16 * t * f.s * bloom + 0.03;
            const [rx, ry, rz] = rotXY(sx, sy, sz, f.rx, f.ry);
            const tip = t > 0.85;
            put(fx + rx, fy + ry, fz + rz, tip ? '@' : ':', tip ? 255 : 230, tip ? 235 : 240, tip ? 85 : 165);
          }
        }
      }
    }

    function frame(now) {
      if (t0 === null) t0 = now;
      const sec = Math.max(0, (now - t0) / 1000);

      zbuf.fill(-1e9);
      cbuf.fill(null);

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      ctx.font = `bold ${CH}px "Courier New", monospace`;
      ctx.textBaseline = 'top';

      for (let i = 0; i < stars.length; i++) {
        const d = stars[i];
        const a = 0.12 + 0.35 * (0.5 + 0.5 * Math.sin(sec * d.sp + d.p));
        ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
        ctx.fillText('.', d.x, d.y);
      }

      const globalSway = Math.sin(sec * 0.8) * 0.015;
      drawWrapper(globalSway);

      for (let i = 0; i < bouquet.length; i++) {
        const f = bouquet[i];
        const sway = globalSway + Math.sin(sec * 0.9 + i * 0.85) * 0.012;
        const p = Math.max(0, Math.min(1, (sec - f.d) / 2.2));
        const bloom = 0.1 + 0.9 * (1 - Math.pow(1 - p, 3));

        stem(f, sway);
        lily(f, bloom, sway, sec);
      }

      for (let y = 0; y < rows; y++) {
        const off = y * cols;
        for (let x = 0; x < cols; x++) {
          const i = off + x;
          if (cbuf[i]) {
            ctx.fillStyle = colbuf[i];
            ctx.fillText(cbuf[i], x * CW, y * CH);
          }
        }
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', setup);
    window.addEventListener('click', () => { t0 = null; });

    setup();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
